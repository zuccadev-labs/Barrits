version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Tauri example (Rust crate). Deno is not supported by Dependabot; the Deno examples pin the SDK by path.
  - package-ecosystem: cargo
    directory: "/packages/sdk/ts_js/examples/example-tauri/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
