name: Security Enhanced

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 3 * * 0'  # Weekly Sunday 3am UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ── Dependency Review (PR-only) ───────────────────────────────────────────
  dependency-review-support:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.probe.outputs.supported }}
    steps:
      - name: Probe dependency graph support
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/${{ github.repository }}/dependency-graph/sbom > /dev/null 2>&1; then
            echo "supported=true" >> $GITHUB_OUTPUT
          else
            echo "supported=false" >> $GITHUB_OUTPUT
          fi

  dependency-review:
    needs: dependency-review-support
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency graph unavailable notice
        if: needs.dependency-review-support.outputs.supported != 'true'
        run: |
          echo "Dependency graph is not enabled for this repository."
          echo "Skipping dependency-review until enabled in repo settings."

      - name: Dependency review
        if: needs.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4

  # ── npm audit (all events) ────────────────────────────────────────────────
  npm-audit-enhanced:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (production only, high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Export full audit report artifact
        if: always()
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit-report.json

  # ── Secret scanning ───────────────────────────────────────────────────────
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq git-secrets

      - name: Register AWS patterns
        run: git secrets --register-aws --global

      - name: Scan for secrets
        id: secret_scan
        run: |
          if git secrets --scan-history 2>&1; then
            echo "No secrets detected."
            echo "secrets_found=false" >> $GITHUB_OUTPUT
          else
            echo "Potential secrets detected!"
            echo "secrets_found=true" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Fail if secrets found
        if: steps.secret_scan.outputs.secrets_found == 'true'
        run: |
          echo "Secret scanning failed – potential credentials detected."
          exit 1

  # ── SBOM (main push only) ─────────────────────────────────────────────────
  sbom:
    needs: npm-audit-enhanced
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM
        run: |
          npx --yes @cyclonedx/cyclonedx-npm --output-format XML --output-file bom.xml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: software-bill-of-materials
          path: bom.xml

  # ── Summary ───────────────────────────────────────────────────────────────
  security-summary:
    needs: [npm-audit-enhanced, secret-scanning]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Security check summary
        run: |
          echo "Security checks completed for commit ${{ github.sha }}"
          echo "npm-audit: ${{ needs.npm-audit-enhanced.result }}"
          echo "secret-scan: ${{ needs.secret-scanning.result }}"
