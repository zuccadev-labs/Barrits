name: CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  NPM_VERSION: 11.6.2
  BUN_VERSION: 1.3.12
  DENO_VERSION: v2.x

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: npm ci

      # ── SDK gates ────────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Build SDK
        run: npm run build

      - name: Test SDK (with coverage)
        run: npm run test:coverage

      - name: Validate JSR surface
        run: npm run publish:jsr:dry-run

      # ── Examples: build ──────────────────────────────────────────────────────
      - name: Build Node.js example
        run: npm run build --workspace example-nodejs

      - name: Build React example
        run: npm run build --workspace example-react

      - name: Build Vue example
        run: npm run build --workspace example-vue

      - name: Build Solid example
        run: npm run build --workspace example-solid

      - name: Build Svelte example
        run: npm run build --workspace example-svelte

      - name: Build bundlers example
        run: npm run build:all --workspace examples-bundlers

      - name: Build Tauri frontend shell
        run: npm run build --workspace example-tauri

      # ── Examples: tests (npm workspaces) ─────────────────────────────────────
      - name: Test Node.js example
        run: npm test --workspace example-nodejs

      - name: Test React example
        run: npm test --workspace example-react

      - name: Test Vue example
        run: npm test --workspace example-vue

      - name: Test Solid example
        run: npm test --workspace example-solid

      - name: Test Svelte example
        run: npm test --workspace example-svelte

      - name: Test bundlers example
        run: npm test --workspace examples-bundlers

      - name: Test Tauri frontend shell
        run: npm test --workspace example-tauri

      # ── Examples: Deno ───────────────────────────────────────────────────────
      - name: Validate Deno example
        run: |
          Push-Location './packages/sdk/ts_js/examples/example-deno'
          deno task build
          deno task inspect
          deno task test
          Pop-Location

      - name: Validate Deno BaaS example
        run: |
          Push-Location './packages/sdk/ts_js/examples/example-deno-baas'
          deno task inspect
          deno task test
          Pop-Location

      # ── Examples: Bun ────────────────────────────────────────────────────────
      - name: Validate Bun example
        run: |
          Push-Location './packages/sdk/ts_js/examples/example-bun'
          bun run showcase
          bun run inspect
          bun run build
          bun test
          Pop-Location
