name: Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, using vX.Y.Z or pre-vX.Y.Z-rc.N
        required: true
        type: string
      publish_npm:
        description: Publish the Node.js package to npm
        required: true
        default: true
        type: boolean
      publish_jsr:
        description: Publish the Deno package surface to JSR
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
      - 'pre-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  NPM_VERSION: 11.6.2
  DENO_VERSION: v2.x

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_version: ${{ steps.context.outputs.release_version }}
      release_channel: ${{ steps.context.outputs.release_channel }}
      target_branch: ${{ steps.context.outputs.target_branch }}
      release_sha: ${{ steps.context.outputs.release_sha }}
      npm_dist_tag: ${{ steps.context.outputs.npm_dist_tag }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
      release_name: ${{ steps.context.outputs.release_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # no dependency cache in a publishing workflow (cache poisoning)

      - name: Resolve release context
        id: context
        # Inputs through the environment, never expanded into the script (template injection: a tag name is
        # chosen by whoever dispatches the workflow).
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git fetch --force origin main dev --tags
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          if (-not $tag) {
            throw "A release tag is required. Use vX.Y.Z for stable releases or pre-vX.Y.Z-rc.N for prereleases."
          }
          $releaseSha = git rev-list -n 1 $tag
          if (-not $releaseSha) {
            throw "Unable to resolve commit SHA for tag '$tag'."
          }
          $remoteBranches = git branch -r --contains $releaseSha | Out-String
          if ($tag.StartsWith("pre-v")) {
            $channel = "prerelease"
            $version = $tag.Substring(5)
            $npmTag = "next"
            $isPrerelease = "true"
            $releaseName = "Barrits prerelease $version"
            # Prerelease can be on dev (normal) or main (final stabilization)
            if ($remoteBranches -match "origin/dev") {
              $targetBranch = "dev"
            } elseif ($remoteBranches -match "origin/main") {
              $targetBranch = "main"
            } else {
              throw "Commit $releaseSha for prerelease tag $tag is not in origin/dev or origin/main."
            }
          } elseif ($tag.StartsWith("v")) {
            $channel = "release"
            $version = $tag.Substring(1)
            $targetBranch = "main"
            $npmTag = "latest"
            $isPrerelease = "false"
            $releaseName = "Barrits $version"
            if ($remoteBranches -notmatch "origin/main") {
              throw "Stable release tag $tag must be in origin/main."
            }
          } else {
            throw "Unsupported tag format '$tag'. Expected vX.Y.Z or pre-vX.Y.Z-rc.N."
          }
          if ($channel -eq "prerelease" -and $version -notmatch "-") {
            throw "Prerelease tags must include a prerelease SemVer suffix, for example pre-v0.2.0-rc.1."
          }
          if ($channel -eq "release" -and $version -match "-") {
            throw "Stable release tags must not include prerelease suffixes."
          }
          $packageVersion = node -p "require('./packages/sdk/ts_js/package.json').version"
          $jsrVersion = node -p "require('./packages/sdk/ts_js/jsr.json').version"
          $monorepoVersion = node -p "require('./package.json').version"
          # The three version fields must equal the tag version exactly. npm and JSR publish the
          # manifest version, not the tag: accepting a stable prefix let pre-v0.4.0-rc.1 publish
          # "0.4.0" (final on JSR) and made the real v0.4.0 tag a no-op.
          foreach ($pair in @(@("monorepo package.json", $monorepoVersion), @("package.json", $packageVersion), @("jsr.json", $jsrVersion))) {
            if ($pair[1] -ne $version) {
              throw "$($pair[0]) version '$($pair[1])' does not match tag version '$version'. Set it to '$version' before tagging."
            }
          }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "release_channel=$channel" >> $env:GITHUB_OUTPUT
          "target_branch=$targetBranch" >> $env:GITHUB_OUTPUT
          "release_sha=$releaseSha" >> $env:GITHUB_OUTPUT
          "npm_dist_tag=$npmTag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

  publish-npm:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # no dependency cache in a publishing workflow (cache poisoning)

      - name: Setup npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run lint
          npm run typecheck

      - name: Build SDK
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Publish npm package
        working-directory: packages/sdk/ts_js
        run: |
          $version = "${{ needs.prepare.outputs.release_version }}"
          $distTag = "${{ needs.prepare.outputs.npm_dist_tag }}"
          $packageName = node -p "require('./package.json').name"

          # Check if this exact version already exists on npm
          $existingVersions = npm view "$packageName" versions --json 2>$null | ConvertFrom-Json
          $alreadyPublished = $existingVersions -contains $version

          if ($alreadyPublished) {
            Write-Host "::warning::Version $version already exists on npm (likely published by a prerelease). GitHub Actions provenance cannot promote dist-tags automatically. Please run manually locally: npm dist-tag add ${packageName}@${version} ${distTag}"
          } else {
            Write-Host "Publishing $packageName@$version with dist-tag '$distTag'."
            npm publish --access public --provenance --tag $distTag
          }

  publish-jsr:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.publish_jsr
    runs-on: ubuntu-latest
    environment: jsr
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # no dependency cache in a publishing workflow (cache poisoning)

      - name: Setup npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Install dependencies
        run: npm ci

      # The test suite runs the built CLI (dist/), so the build goes before it, as in publish-npm.
      - name: Quality gates
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Validate JSR payload
        run: npm run publish:jsr:dry-run

      - name: Publish JSR package
        working-directory: packages/sdk/ts_js
        run: deno publish --allow-dirty --config jsr.json

  github-release:
    needs:
      - prepare
      - publish-npm
      - publish-jsr
    # A manual run may publish only one registry (publish_npm / publish_jsr); the job it skips
    # counts as done. Any failure still blocks the GitHub release.
    if: >-
      always() && needs.prepare.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs['publish-npm'].result) &&
      contains(fromJSON('["success","skipped"]'), needs['publish-jsr'].result) &&
      !(needs['publish-npm'].result == 'skipped' && needs['publish-jsr'].result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # attestation: Sigstore signature bound to this workflow
      attestations: write
    steps:
      # The annotated tag message is the human-written summary of the release.
      # generate_release_notes on its own discards it and publishes only a flat
      # list of merged pull request titles, which misrepresents any change that
      # was merged and later reverted within the same cycle. Reading the
      # annotation and passing it as the body puts the summary first and keeps
      # the generated list appended underneath it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - name: Read annotated tag message
        id: tag_message
        shell: bash
        run: |
          tag="${{ needs.prepare.outputs.release_tag }}"
          # actions/checkout may leave a lightweight copy of the tag; fetch the annotated object.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          body="$(git tag -l --format='%(contents)' "$tag")"
          if [ -z "$body" ]; then
            echo "::warning::Tag $tag carries no annotation; falling back to generated notes only."
          fi
          {
            echo "body<<TAG_ANNOTATION_EOF"
            echo "$body"
            echo "TAG_ANNOTATION_EOF"
          } >> "$GITHUB_OUTPUT"

      # The npm tarball, rebuilt from the tag, attached to the release with a SLSA build provenance attestation
      # (`gh attestation verify <file> -R zuccadev-labs/Barrits`). npm already carries its own provenance.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false # no dependency cache in a publishing workflow (cache poisoning)

      - name: Setup npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and pack the SDK
        shell: bash
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/dist"
          (cd packages/sdk/ts_js && npm pack --pack-destination "$RUNNER_TEMP/dist")
          ls -l "$RUNNER_TEMP/dist"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*.tgz

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          body: ${{ steps.tag_message.outputs.body }}
          generate_release_notes: true
          files: ${{ runner.temp }}/dist/*.tgz
