name: Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, using vX.Y.Z or pre-vX.Y.Z-rc.N
        required: true
        type: string
      publish_npm:
        description: Publish the Node.js package to npm
        required: true
        default: true
        type: boolean
      publish_jsr:
        description: Publish the Deno package surface to JSR
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'
      - 'pre-v*'
permissions:
  contents: write
  id-token: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.context.outputs.release_tag }}
      release_version: ${{ steps.context.outputs.release_version }}
      release_channel: ${{ steps.context.outputs.release_channel }}
      target_branch: ${{ steps.context.outputs.target_branch }}
      release_sha: ${{ steps.context.outputs.release_sha }}
      npm_dist_tag: ${{ steps.context.outputs.npm_dist_tag }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
      release_name: ${{ steps.context.outputs.release_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup npm
        run: sudo npm install --global npm@11.6.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve release context
        id: context
        run: |
          git fetch --force origin main dev --tags
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.release_tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          if (-not $tag) {
            throw "A release tag is required. Use vX.Y.Z for stable releases or pre-vX.Y.Z-rc.N for prereleases."
          }
          $releaseSha = git rev-list -n 1 $tag
          if (-not $releaseSha) {
            throw "Unable to resolve commit SHA for tag '$tag'."
          }
          $remoteBranches = git branch -r --contains $releaseSha | Out-String
          if ($tag.StartsWith("pre-v")) {
            $channel = "prerelease"
            $version = $tag.Substring(5)
            $npmTag = "next"
            $isPrerelease = "true"
            $releaseName = "Barrits prerelease $version"
            # Prerelease can be on dev (normal) or main (final stabilization)
            if ($remoteBranches -match "origin/dev") {
              $targetBranch = "dev"
            } elseif ($remoteBranches -match "origin/main") {
              $targetBranch = "main"
            } else {
              throw "Commit $releaseSha for prerelease tag $tag is not in origin/dev or origin/main."
            }
          } elseif ($tag.StartsWith("v")) {
            $channel = "release"
            $version = $tag.Substring(1)
            $targetBranch = "main"
            $npmTag = "latest"
            $isPrerelease = "false"
            $releaseName = "Barrits $version"
            if ($remoteBranches -notmatch "origin/main") {
              throw "Stable release tag $tag must be in origin/main."
            }
          } else {
            throw "Unsupported tag format '$tag'. Expected vX.Y.Z or pre-vX.Y.Z-rc.N."
          }
          if ($channel -eq "prerelease" -and $version -notmatch "-") {
            throw "Prerelease tags must include a prerelease SemVer suffix, for example pre-v0.2.0-rc.1."
          }
          if ($channel -eq "release" -and $version -match "-") {
            throw "Stable release tags must not include prerelease suffixes."
          }
          $packageVersion = node -p "require('./packages/sdk/ts_js/package.json').version"
          $jsrVersion = node -p "require('./packages/sdk/ts_js/jsr.json').version"
          $monorepoVersion = node -p "require('./package.json').version"
          # Version validation
          if ($channel -eq "prerelease") {
            # Accept matching prerelease or stable prefix for prerelease tags
            if ($monorepoVersion -ne $version -and $monorepoVersion -ne "0.1.0" -and -not $version.StartsWith($monorepoVersion)) {
              throw "monorepo package.json version '$monorepoVersion' does not match tag version '$version' (or its stable prefix)."
            }
            if ($packageVersion -ne $version -and -not $version.StartsWith($packageVersion)) {
              throw "package.json version '$packageVersion' does not match tag version '$version' (or its stable prefix)."
            }
            if ($jsrVersion -ne $version -and -not $version.StartsWith($jsrVersion)) {
              throw "jsr.json version '$jsrVersion' does not match tag version '$version' (or its stable prefix)."
            }
          } else {
            if ($monorepoVersion -ne $version) {
              throw "monorepo package.json version '$monorepoVersion' does not match tag version '$version'."
            }
            if ($packageVersion -ne $version) {
              throw "package.json version '$packageVersion' does not match tag version '$version'."
            }
            if ($jsrVersion -ne $version) {
              throw "jsr.json version '$jsrVersion' does not match tag version '$version'."
            }
          }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "release_channel=$channel" >> $env:GITHUB_OUTPUT
          "target_branch=$targetBranch" >> $env:GITHUB_OUTPUT
          "release_sha=$releaseSha" >> $env:GITHUB_OUTPUT
          "npm_dist_tag=$npmTag" >> $env:GITHUB_OUTPUT
          "is_prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
  publish-npm:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.publish_npm
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup npm
        run: sudo npm install --global npm@11.6.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm install
      - name: Build SDK
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Publish npm package
        working-directory: packages/sdk/ts_js
        run: |
          $version = "${{ needs.prepare.outputs.release_version }}"
          $distTag = "${{ needs.prepare.outputs.npm_dist_tag }}"
          $packageName = node -p "require('./package.json').name"

          # Check if this exact version already exists on npm
          $existingVersions = npm view "$packageName" versions --json 2>$null | ConvertFrom-Json
          $alreadyPublished = $existingVersions -contains $version

          if ($alreadyPublished) {
            Write-Host "::warning::Version $version already exists on npm (likely published by a prerelease). GitHub Actions provenance cannot promote dist-tags automatically. Please run manually locally: npm dist-tag add ${packageName}@${version} ${distTag}"
          } else {
            Write-Host "Publishing $packageName@$version with dist-tag '$distTag'."
            npm publish --access public --provenance --tag $distTag
          }
  publish-jsr:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || inputs.publish_jsr
    runs-on: ubuntu-latest
    environment: jsr
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup npm
        run: sudo npm install --global npm@11.6.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dependencies
        run: npm install
      - name: Validate JSR payload
        run: npm run publish:jsr:dry-run
      - name: Publish JSR package
        working-directory: packages/sdk/ts_js
        run: npx jsr publish --allow-dirty
  github-release:
    needs:
      - prepare
      - publish-npm
      - publish-jsr
    if: always() && needs.prepare.result == 'success' && needs['publish-npm'].result == 'success' && needs['publish-jsr'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_name }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
