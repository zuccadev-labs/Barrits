name: Security

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review-support:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    outputs:
      supported: ${{ steps.probe.outputs.supported }}

    steps:
      - name: Probe dependency graph support
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dependency-graph/sbom 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            "supported=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "supported=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          exit 0

  dependency-review:
    needs: dependency-review-support
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency graph unavailable
        if: needs.dependency-review-support.outputs.supported != 'true'
        run: |
          Write-Host "Dependency graph is not enabled for this repository."
          Write-Host "Skipping dependency-review until GitHub support is available in repo settings."

      - name: Dependency review
        if: needs.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@v5

  npm-audit:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high