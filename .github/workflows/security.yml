name: Security

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  NPM_VERSION: 11.6.2

jobs:
  # ── Dependency review (pull requests only) ─────────────────────────────────
  dependency-review-support:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.probe.outputs.supported }}
    steps:
      - name: Probe dependency graph support
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" > /dev/null 2>&1; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    needs: dependency-review-support
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency graph unavailable
        if: needs.dependency-review-support.outputs.supported != 'true'
        run: |
          echo "Dependency graph is not enabled for this repository."
          echo "Skipping dependency-review until it is enabled in the repository settings."

      - name: Dependency review
        if: needs.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # ── npm audit (every event) ────────────────────────────────────────────────
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependency graph (high+ severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Export full audit report
        if: always()
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: audit-report.json

  # ── Secret scanning ────────────────────────────────────────────────────────
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # gitleaks with its default rules (hundreds of providers), not git-secrets' AWS-only patterns; the image
      # is pinned by digest (before, git-secrets was cloned from its moving default branch on every run).
      # Reviewed false positives are listed by fingerprint in .gitleaksignore.
      - name: Scan history for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore

  # ── Workflow security (zizmor) ─────────────────────────────────────────────
  # Static analysis of the GitHub Actions workflows themselves: template injection, credentials left in the
  # checkout, excessive permissions, unpinned actions.
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src ghcr.io/zizmorcore/zizmor:1.32.0 \
            --offline --min-severity medium .github/workflows

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 -color=false

  # ── SBOM (main only) ───────────────────────────────────────────────────────
  sbom:
    needs: npm-audit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned: an unpinned npx runs whatever was published last. cyclonedx-npm 7.0.0 dropped its
      # bundled XML serializer (optional peer xmlbuilder2) and broke this job on main. JSON is
      # CycloneDX's primary format and needs no optional peer.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@7.0.0 --output-format JSON --output-file bom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-bill-of-materials
          path: bom.json
